<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FOOT RUNNER</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07101f;color:white;font-family:system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}video{position:fixed;right:10px;bottom:10px;width:120px;height:82px;object-fit:cover;border-radius:12px;opacity:.65;transform:scaleX(-1)}.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:18px;font-weight:900}.msg{position:fixed;top:16%;left:50%;transform:translateX(-50%);font-size:clamp(28px,8vw,54px);font-weight:900;text-shadow:0 4px 15px #000}.buttons{position:fixed;left:10px;bottom:10px;display:flex;gap:7px;max-width:70%;flex-wrap:wrap}button{border:0;border-radius:13px;padding:12px;font-weight:800}.primary{background:#66e3ff}.help{position:fixed;bottom:13%;left:50%;transform:translateX(-50%);background:#000a;padding:9px 13px;border-radius:12px;text-align:center;font-size:12px}</style></head>
<body><canvas id="c"></canvas><video id="v" playsinline muted></video><div class="top"><span>FOOT RUNNER</span><span id="score">0 m</span></div><div class="msg" id="msg">カメラを開始</div><div class="buttons"><button class="primary" id="cam">カメラ開始</button><button id="cal">基準登録</button><button id="snd">音 ON</button></div><div class="help">足元へカメラを向けます<br>足踏み＝走る ／ 大きな動き＝ジャンプ（実験版）</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),v=document.querySelector('#v'),msg=document.querySelector('#msg'),score=document.querySelector('#score');
let W,H,t=0,meters=0,jump=0,vy=0,run=0,last=0,base=0,sound=true,audio,prev;
const o=document.createElement('canvas');o.width=80;o.height=60;const q=o.getContext('2d',{willReadFrequently:true});
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function beep(f=300,d=.05){if(!sound)return;audio||=new(window.AudioContext||window.webkitAudioContext)();let a=audio.createOscillator(),g=audio.createGain();a.frequency.value=f;g.gain.value=.025;a.connect(g);g.connect(audio.destination);a.start();a.stop(audio.currentTime+d)}
async function camera(){try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});v.srcObject=s;await v.play();msg.textContent='足を止めて「基準登録」';}catch(e){msg.textContent='カメラを開始できません';alert(e.message)}}
function motion(){if(v.readyState<2)return 0;q.drawImage(v,0,0,80,60);let d=q.getImageData(0,0,80,60).data,g=new Uint8Array(4800),s=0;for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=(d[i]+d[i+1]+d[i+2])/3;if(prev){for(let i=0;i<g.length;i++)s+=Math.abs(g[i]-prev[i]);s/=g.length}prev=g;return s}
cam.onclick=camera;cal.onclick=()=>{let n=0,a=0;msg.textContent='静止してください…';let z=setInterval(()=>{a+=motion();if(++n>=12){clearInterval(z);base=a/n;msg.textContent='GO! 足踏み！';beep(650,.12)}},80)};snd.onclick=e=>{sound=!sound;e.target.textContent='音 '+(sound?'ON':'OFF')};
function update(){let m=motion(),th=Math.max(5,base+4);if(m>th){run=Math.min(1,run+.25);meters+=.025;last=performance.now();if(Math.random()<.1)beep(120,.03)}if(performance.now()-last>160)run*=.82;if(m>Math.max(15,base+13)&&jump===0){vy=-11;jump=.01;msg.textContent='JUMP!';beep(540,.1)}if(jump!==0){vy+=.7;jump+=vy;if(jump>=0){jump=0;vy=0}}if(jump===0)msg.textContent=run>.2?'RUN!':'足踏み！';score.textContent=Math.floor(meters)+' m'}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#142c52');g.addColorStop(1,'#07101f');x.fillStyle=g;x.fillRect(0,0,W,H);let ground=H*.72;x.fillStyle='#0b1730';for(let a=0;a<W;a+=48)x.fillRect(a,ground-60-(a*7%100),40,60+(a*7%100));x.fillStyle='#17243b';x.fillRect(0,ground,W,H-ground);x.strokeStyle='#66e3ff55';x.lineWidth=2;for(let a=-((t*run*6)%80);a<W;a+=80){x.beginPath();x.moveTo(a,ground+55);x.lineTo(a+42,ground+55);x.stroke()}let px=W*.23,py=ground-45+jump;x.save();x.translate(px,py);x.strokeStyle='white';x.lineWidth=7;x.lineCap='round';x.beginPath();x.arc(0,-42,12,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(0,-30);x.lineTo(0,5);x.stroke();let p=Math.sin(t*.35*run)*20;x.beginPath();x.moveTo(0,-18);x.lineTo(-18-p*.3,-2);x.moveTo(0,-18);x.lineTo(18+p*.3,-2);x.moveTo(0,5);x.lineTo(-14-p,38);x.moveTo(0,5);x.lineTo(14+p,38);x.stroke();x.restore();t++;update();requestAnimationFrame(draw)}draw();
</script></body></html>
