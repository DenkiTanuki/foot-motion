<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><title>Foot Motion</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}.app{height:100dvh;position:relative;background:radial-gradient(circle at 50% 20%,#18385a,#07111f 55%)}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{z-index:2}.shade{position:absolute;inset:0;z-index:3;background:linear-gradient(#06101acc 0 18%,transparent 35% 72%,#06101add 100%);pointer-events:none}.hud{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));pointer-events:none}.top{width:100%;display:flex;justify-content:space-between;font-weight:800}.pill{background:#07111fcc;border:1px solid #ffffff26;border-radius:999px;padding:8px 12px;backdrop-filter:blur(8px)}.prompt{text-align:center;margin-top:3vh}.arrow{font-size:clamp(78px,28vw,150px);font-weight:900;line-height:.85;text-shadow:0 0 30px #62d9ff}.label{font-size:clamp(24px,7vw,40px);font-weight:900;letter-spacing:.05em}.feedback{height:42px;font-size:30px;font-weight:1000;color:#7ef3bd;text-shadow:0 0 20px #23d999}.bottom{width:100%;text-align:center}.status{font-size:13px;opacity:.85;margin-bottom:8px}.bar{height:8px;border-radius:99px;background:#ffffff1c;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px}.controls{position:absolute;z-index:8;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}.controls button{border:0;border-radius:16px;padding:13px 16px;font-weight:850;font-size:15px;background:#fff;color:#07111f;box-shadow:0 8px 30px #0006}.controls button.secondary{background:#10263b;color:#fff;border:1px solid #ffffff24}.intro{position:absolute;z-index:10;inset:0;background:#07111ff2;display:flex;align-items:center;justify-content:center;padding:22px}.card{max-width:520px;background:#0e2033;border:1px solid #ffffff20;border-radius:26px;padding:24px;box-shadow:0 20px 80px #0008}.card h1{margin:0 0 10px;font-size:30px}.card p{line-height:1.65;color:#d8e8f5}.card button{width:100%;border:0;border-radius:16px;padding:15px;font-weight:900;font-size:17px}.guide{position:absolute;z-index:5;left:8%;right:8%;bottom:17%;height:26%;border:2px dashed #ffffff55;border-radius:24px;pointer-events:none}.guide:after{content:'足元をこの範囲に';position:absolute;top:-30px;width:100%;text-align:center;font-size:13px;color:#fff9}.hidden{display:none}.warn{color:#ffd18a;font-size:12px;margin-top:10px}
</style></head><body><div class='app'><video id='v' autoplay playsinline muted></video><canvas id='c'></canvas><div class='shade'></div><div class='guide'></div><div class='hud'><div class='top'><div class='pill'>SCORE <span id='score'>0</span></div><div class='pill'>COMBO ×<span id='combo'>0</span></div></div><div class='prompt'><div id='arrow' class='arrow'>●</div><div id='label' class='label'>READY</div><div id='fb' class='feedback'></div></div><div class='bottom'><div id='status' class='status'>カメラ準備中</div><div class='bar'><i id='meter'></i></div></div></div><div class='controls'><button id='cal' class='secondary'>中央を登録</button><button id='start'>START</button></div><div id='intro' class='intro'><div class='card'><h1>FOOT MOTION</h1><p>スマホを床から少し離して立て、<b>膝下〜足元</b>が映るようにしてください。最初に静止した足元を登録し、その後の画像変化から左右ステップと足上げを簡易判定します。</p><p>これはAI骨格認識版の前段階となる<b>動き検出デモ</b>です。明るい場所・背景が動かない場所ほど反応しやすくなります。</p><button id='camera'>カメラを開始</button><div class='warn'>※ Safariではカメラ利用にHTTPS環境が必要な場合があります。ローカルHTMLを直接開いた場合、カメラが許可されないことがあります。</div></div></div></div><script>
const v=document.querySelector('#v'), c=document.querySelector('#c'),x=c.getContext('2d',{willReadFrequently:true});let baseline=null,playing=false,target=null,score=0,combo=0,lastHit=0,prev=null;
const dirs=[{k:'L',a:'←',t:'LEFT STEP'},{k:'R',a:'→',t:'RIGHT STEP'},{k:'U',a:'↑',t:'FOOT UP'}];
async function cam(){try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=s;await v.play();document.querySelector('#intro').classList.add('hidden');resize();status('足元を枠内に入れて「中央を登録」');loop()}catch(e){alert('カメラを開始できませんでした。Safariのカメラ許可とHTTPS環境を確認してください。\n'+e.message)}}
function resize(){c.width=320;c.height=240} addEventListener('resize',resize);
function frame(){x.save();x.scale(-1,1);x.drawImage(v,-c.width,0,c.width,c.height);x.restore();return x.getImageData(0,0,c.width,c.height)}
function gray(im){let a=new Uint8Array(im.width*im.height);for(let i=0,j=0;i<im.data.length;i+=4,j++)a[j]=(im.data[i]*.3+im.data[i+1]*.59+im.data[i+2]*.11)|0;return a}
function metrics(a,b){let w=320,h=240;let L=0,R=0,U=0,N=0;for(let y=80;y<235;y+=3)for(let xx=10;xx<310;xx+=3){let i=y*w+xx,d=Math.abs(a[i]-b[i]);if(d>34){N++; if(xx<w*.43)L++; else if(xx>w*.57)R++; if(y<h*.68)U++;}}return{L,R,U,N}}
function calibrate(){baseline=gray(frame());prev=baseline;status('登録しました。STARTを押してください');document.querySelector('#fb').textContent='SET ✓'}
function next(){target=dirs[Math.floor(Math.random()*dirs.length)];arrow.textContent=target.a;label.textContent=target.t;fb.textContent='';lastHit=performance.now()}
function start(){if(!baseline)return status('先に「中央を登録」してください');playing=!playing;document.querySelector('#start').textContent=playing?'PAUSE':'START';if(playing)next();else{arrow.textContent='●';label.textContent='PAUSE'}}
function hit(){score+=100+combo*5;combo++;document.querySelector('#score').textContent=score;document.querySelector('#combo').textContent=combo;fb.textContent='GREAT!';navigator.vibrate?.(40);playing=false;setTimeout(()=>{playing=true;next()},550)}
function status(s){document.querySelector('#status').textContent=s}
function loop(){if(v.readyState>=2){let g=gray(frame());if(baseline&&playing){let m=metrics(g,baseline), total=Math.max(1,m.N), conf=0,ok=false;if(target.k==='L'){conf=m.L/55;ok=m.L>55&&m.L>m.R*1.12}else if(target.k==='R'){conf=m.R/55;ok=m.R>55&&m.R>m.L*1.12}else{conf=m.U/45;ok=m.U>45&&m.U>(m.L+m.R)*.18}meter.style.width=Math.min(100,conf*100)+'%';status(`動き L:${m.L} R:${m.R} UP:${m.U}`);if(ok&&performance.now()-lastHit>450)hit();if(performance.now()-lastHit>4500){combo=0;document.querySelector('#combo').textContent=0;next()}}prev=g}requestAnimationFrame(loop)}
document.querySelector('#camera').onclick=cam;document.querySelector('#cal').onclick=calibrate;document.querySelector('#start').onclick=start;
</script></body></html>
